; Production PHP settings for Vercel. vercel-php appends this file to its own
; php.ini at build time, so these lines take precedence.
;
; Never print errors into the page: a visitor saw "...on line 60" because a
; PHP 8.5 deprecation notice was echoed above the HTML. Errors still go to the
; function logs in the Vercel dashboard.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
